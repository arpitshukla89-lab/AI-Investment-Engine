function showTab(id,el){
document.querySelectorAll(".tabContent").forEach(e=>e.classList.remove("active"));

document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));

function calculate(){

let income = Number(document.getElementById("income").value);
let emi = Number(document.getElementById("emi").value);
let goal = Number(document.getElementById("goal").value);
let years = Number(document.getElementById("years").value);
let risk = document.getElementById("risk").value;

// ✅ NEW INPUT
let expensePercentInput = Number(document.getElementById("expensePercent").value);

if(!income || !goal || !years){ alert("Fill required fields"); return; }

// ===== HEALTH CALC =====

// ✅ UPDATED
let expensePercent = expensePercentInput || 50;
let expense = income * (expensePercent/100);
let suggestedExpense = income * 0.5;

let emergency6 = expense*6;
let emergency9 = expense*9;
let emergency12 = expense*12;

let emiRatio = (emi/income)*100 || 0;

// ✅ UPDATED SCORE
let totalBurden = emiRatio + expensePercent;
let score = 100 - totalBurden;
score = Math.max(0, Math.min(100, score));
score = Math.max(0, Math.min(100, score));

let emiColor = emiRatio <=30 ? "#22c55e" : emiRatio <=40 ? "#eab308" : "#ef4444";

// ✅ CATEGORY
let expenseStatus = expensePercent <=50 ? "🟢 Healthy Spending" :
expensePercent<=70 ? "🟡 Moderate Spending" : "🔴 High Spending";

let expenseColor = expensePercent <=50 ? "#22c55e" :
expensePercent<=70 ? "#eab308" : "#ef4444";
// ✅ AI ADVICE
let advice = "";

if(score < 40){
  advice = "🚨 You are financially stressed. Reduce expenses or EMI immediately.";
}
else if(score < 70){
  advice = "⚠️ You are average. Improve savings and control expenses.";
}
else{
  advice = "✅ You are doing great. Increase investments for faster growth.";
}

// ✅ RISK ALERT
let riskAlert = (emiRatio + expensePercent) > 80 
? "🚨 High Financial Risk" 
: "✅ Risk Under Control";

// ===== HEALTH TAB =====
document.getElementById("health").innerHTML=`

<!-- ✅ CARD 1 -->
<div class="card">

<div class="highlight" style="color:${score>=75?'#22c55e':score>=50?'#eab308':'#ef4444'}">
Score ${score.toFixed(0)}

<span class="dot yellow"></span>30-40

</p>

</div>

<!-- ✅ CARD 2 -->
<div class="card">

<p>Monthly Expense: ₹${expense} (${expensePercent}%)</p>

<p style="color:#a78bfa;">
💡 Suggested Expense: ₹${suggestedExpense.toFixed(0)} (50% rule)
</p>

</div>

<p style="color:${expenseColor};font-weight:bold;">
${expenseStatus}
</p>

</div>

<!-- ✅ CARD 3 -->
<div class="card">

<p>Emergency Fund: ₹${emergency6}</p>

</div>

${advice}
</p>

<p style="color:${(emiRatio+expensePercent)>80?'#ef4444':'#22c55e'};font-weight:bold;">
${riskAlert}
</p>

<p style="font-size:12px;">AI based estimation</p>

`;
let ctx1 = document.getElementById("emergencyChart").getContext("2d");

let gradient1 = ctx1.createLinearGradient(0,0,0,300);
gradient1.addColorStop(0,"#22c55e");
gradient1.addColorStop(1,"#0f172a");

new Chart(ctx1,{
type:'bar',
data:{
labels:['6 Months','9 Months','12 Months'],

},
options:{
layout:{padding:{top:30}},

duration:1500,
easing:'easeOutQuart'
},
plugins:{

},

x:{ticks:{color:"white"}},
y:{ticks:{color:"white"}}
}
},
plugins:[{

const {ctx}=chart;
chart.data.datasets.forEach((d,i)=>{
chart.getDatasetMeta(i).data.forEach((bar,index)=>{
ctx.fillStyle="white";
ctx.fillText("₹"+d.data[index],bar.x,bar.y-10);

}
}]
});

// ===== GOAL TAB (UNCHANGED) =====
let inflation = 0.06;
let rate = risk=="high"?0.14:risk=="medium"?0.12:0.08;

let r = rate/12;

let inflatedGoal = goal*Math.pow(1+inflation,years);

let sipNormal = goal/(((Math.pow(1+r,years*12)-1)/r)*(1+r));
// 🎯 BEST SIP SUGGESTION

let bestSip = sipNormal;


let sipInflation = inflatedGoal/(((Math.pow(1+r,years*12)-1)/r)*(1+r));

// ⚖️ RISK BASED SIP ADJUSTMENT (CORRECT PLACE)
if(risk === "high"){
    bestSip *= 0.9;
}
else if(risk === "low"){
    bestSip *= 1.1;
}

let gap = sipInflation - sipNormal;
let gapPercent = (gap / sipInflation) * 100;

let statusText = "";
let statusColor = "";

if(gapPercent <= 10){
    statusText = "✅ On Track";
    statusColor = "#22c55e";
}else if(gapPercent <= 30){
    statusText = "⚠️ Slightly Behind";
    statusColor = "#eab308";
}else{
    statusText = "🚨 Under Investing";
    statusColor = "#ef4444";
}

// 🎯 SMART STEP-UP (TARGET MATCHING)

let stepUpRate = 0.05; // start with 5%
let futureValue = 0;

for(let trial=0; trial<50; trial++){

    futureValue = 0;
    let currentSip = sipNormal;

    for(let y=1;y<=years;y++){
        for(let m=1;m<=12;m++){
            futureValue += currentSip * Math.pow(1+r, (years*12 - ((y-1)*12+m)));
        }
        currentSip *= (1 + stepUpRate);
    }

    // stop when goal achieved
    if(futureValue >= inflatedGoal) break;

    stepUpRate += 0.01; // increase 1%
}
let months = years * 12;
let yearlyIncome = income * 12;
let wealthRatio = futureValue / yearlyIncome;

let stepUpStatus = futureValue >= inflatedGoal ? "✅ Goal Achievable" : "⚠️ Still Short";
// ✅ SUCCESS PROBABILITY
let probability = (futureValue / inflatedGoal) * 100;
if(probability < 90){
    bestSip = sipInflation * 1.05;
}

// 🤖 AI RECOMMENDATION ENGINE

let aiSuggestion = "";
let aiColor = "";

if(probability < 60){
    aiSuggestion = "🚨 Increase SIP OR extend time horizon";
    aiColor = "#ef4444";
}
else if(probability < 90){
    aiSuggestion = "⚠️ Slight adjustment needed (increase SIP by 5-10%)";
    aiColor = "#eab308";
}
else{
    aiSuggestion = "✅ Perfect plan. Stay consistent 🚀";
    aiColor = "#22c55e";
}
document.getElementById("goalTab").innerHTML=`

<div class="card">

<div class="highlight">SIP ₹${bestSip.toFixed(0)}/month
<p style="color:#38bdf8;font-size:13px;">

<p style="

padding:10px;

">

</p>
</div>

<div class="card">
<h3>📈 Auto SIP Increase Plan</h3>
<p>Start SIP: <b>₹${sipNormal.toFixed(0)}</b></p>
<p>Increase: <b>${(stepUpRate*100).toFixed(1)}% yearly</b></p>
<p style="color:#38bdf8;">
Projected Value: ₹${futureValue.toFixed(0)}
</p>
<p style="color:${futureValue >= inflatedGoal ? '#22c55e' : '#f87171'};font-weight:bold;">

</p>

<p style="color:${aiColor};font-weight:bold;">
${aiSuggestion}
</p>

`;

let corpus=[],real=[];
for(let i=1;i<=years;i++){
let invested = sipNormal*12*i;
let c = invested*Math.pow(1+rate,i);
let rVal = c/Math.pow(1+inflation,i);
corpus.push(c);

let gradient2 = ctx2.createLinearGradient(0,0,0,300);

async function getTopFunds(){

// 🔥 CACHE (FAST LOAD)
let cache = localStorage.getItem("topFunds");

if(cache){
  let parsed = JSON.parse(cache);

  if(Date.now() - parsed.time < 12*60*60*1000){
    return parsed.data;
  }
}

// 🔥 FIXED BEST FUNDS (NO RANDOM)
let schemes = [
122639,
120503,
120716,
120828,
120465,
125354,
118834,
119551,
120186,
118989
];

let results = [];

for(let code of schemes){

  try{

    let res = await fetch(`https://api.mfapi.in/mf/${code}`);
    let data = await res.json();

    let nav = data.data;

    if(!nav || nav.length < 200) continue;

    let latest = parseFloat(nav[0].nav);
    let old = parseFloat(nav[Math.min(750, nav.length-1)].nav);

    let cagr = (Math.pow(latest/old,1/3)-1)*100;

    results.push({
      name: data.meta.scheme_name.substring(0,35),
      return: cagr.toFixed(1)
    });

  }catch(e){
    continue;
  }
}

// 🔥 SORT
results.sort((a,b)=>parseFloat(b.return)-parseFloat(a.return));

// 🔥 SAVE CACHE
localStorage.setItem("topFunds", JSON.stringify({
  time: Date.now(),
  data: results
}));

return results;
}

async function renderPortfolio(risk){

let p = risk=="low"?{e:40,d:50,g:10}:
risk=="medium"?{e:60,d:30,g:10}:
{e:80,d:15,g:5};
let recommendedType = "";
let recommendedTag = "";

if(risk === "high"){
  recommendedTag = "small"; // aggressive
}
else if(risk === "medium"){
  recommendedTag = "flexi";
}
else{
  recommendedTag = "debt";
}
if(p.e >= 70){
recommendedType = "Small / Mid Cap (High Growth)";
}
else if(p.e >= 50){
recommendedType = "Flexi Cap (Balanced)";
}
else{
recommendedType = "Large Cap / Debt (Stable)";
}

let funds = await getTopFunds();
let category = document.getElementById("fundCategory")?.value || "all";

if(category !== "all"){
funds = funds.filter(f => {
let name = f.name.toLowerCase();

if(category === "small") return name.includes("small");
if(category === "flexi") return name.includes("flexi");
if(category === "mid") return name.includes("mid");
if(category === "large") return name.includes("large");

return true;
});
}

funds.sort((a,b)=>parseFloat(b.return)-parseFloat(a.return));

<a href="https://groww.in/mutual-funds" target="_blank" class="optCard equityCard">📊  Mutual Funds ${recommendedTag==="flexi" ? '🔥 <span class="badge">AI Pick</span>' : ''}</a>

<a href="https://kite.zerodha.com" target="_blank" class="optCard equityCard">📉 Stocks ${recommendedTag==="small" ? '🔥 <span class="badge">AI Pick</span>' : ''}</a>

<a href="https://groww.in/etfs" target="_blank" class="optCard equityCard">📦 ETF</a>

<a href="https://smallcase.com" target="_blank" class="optCard equityCard">🎯 Thematic</a>

</div>

</div>

<div id="debt" class="optContent">

<div class="optGrid">

<a href="https://www.bankbazaar.com/fixed-deposit.html" target="_blank" class="optCard debtCard">💰 FD ${recommendedTag==="debt" ? '🔥 <span class="badge">AI Pick</span>' : ''}</a>

<a href="https://groww.in/mutual-funds/category/debt" target="_blank" class="optCard debtCard">📊 Debt Funds</a>

<a href="https://rbiretaildirect.org.in" target="_blank" class="optCard debtCard">📜 Govt Bonds</a>

</div>

</div>

<div id="gold" class="optContent">

<div class="optGrid">

<a href="https://groww.in/gold" target="_blank" class="optCard goldCard">🪙 Digital Gold</a>

<a href="https://www.rbi.org.in" target="_blank" class="optCard goldCard">🏅 SGB</a>

<a href="https://www.nseindia.com" target="_blank" class="optCard goldCard">📊 Gold ETF</a>
</div>

</div>

</div>

</div>
<div class="card">
<div style="background:#020617;padding:12px;border-radius:10px;margin-bottom:10px;border:1px solid #1e293b;">
🎯 Recommended: 
<b style="color:#38bdf8;">${recommendedType}</b>
</div>

<h3>🏆 Top Funds</h3>
<button onclick="refreshFunds()" style="margin-bottom:10px;">
🔄 Refresh Funds
</button>
<select id="fundCategory" 
onchange="renderPortfolio(document.getElementById('risk').value)"
style="margin-bottom:10px;">
<option value="all">All</option>
<option value="small">Small Cap</option>
<option value="flexi">Flexi Cap</option>
<option value="mid">Mid Cap</option>
<option value="large">Large Cap</option>
</select>

<div style="display:grid;grid-template-columns:1fr;gap:12px;margin-top:10px;">

${funds.map((f,i)=>`
<div style="
background:linear-gradient(135deg,#020617,#0f172a);
padding:16px;
border-radius:16px;
border:1px solid rgba(255,255,255,0.08);
display:flex;
flex-direction:column;
gap:6px;
align-items:center;
transition:0.3s;
">

<div>
<div style="font-size:13px;color:#64748b;">#${i+1}</div>
<div style="font-weight:bold;font-size:16px;">${f.name}</div>
<div style="font-size:12px;color:#94a3b8;">3Y CAGR</div>
</div>

<div style="text-align:right;">
<div style="
font-size:18px;
font-weight:bold;
color:${f.return>15 ? '#22c55e' : f.return>12 ? '#eab308' : '#ef4444'};
">
${f.return}%
</div>

<div style="
font-size:12px;
color:${f.return>15 ? '#22c55e' : f.return>12 ? '#eab308' : '#ef4444'};
">
${f.return>15 ? '🔥 Strong' : f.return>12 ? '⚖️ Stable' : '⚠️ Weak'}
</div>
</div>

</div>
`).join("")}

</div>
<div class="card">

<h3>🚀 Invest Now</h3>

<div style="display:flex;gap:10px;margin-top:10px;">

<a href="https://kite.zerodha.com" target="_blank" onclick="trackClick('Zerodha')"
style="flex:1;background:#ff5722;padding:12px;border-radius:10px;text-align:center;color:white;font-weight:bold;">
Zerodha
</a>

<a href="https://groww.in" target="_blank" onclick="trackClick('Groww')"
style="flex:1;background:#00c853;padding:12px;border-radius:10px;text-align:center;color:white;font-weight:bold;">
Groww
</a>

<a href="https://smallcase.com" target="_blank" onclick="trackClick('Smallcase')"
style="flex:1;background:#2979ff;padding:12px;border-radius:10px;text-align:center;color:white;font-weight:bold;">
Smallcase
</a>

</div>

</div>

</div>

`;
}
function refreshFunds(){
  document.getElementById("portfolio").innerHTML = "🔄 Refreshing...";
  localStorage.removeItem("topFunds");
  renderPortfolio(document.getElementById("risk").value);
}
function showOpt(id,el){

document.querySelectorAll(".optContent")
.forEach(e=>e.classList.remove("active"));

document.getElementById(id).classList.add("active");

document.querySelectorAll(".optTab")
.forEach(t=>t.classList.remove("active"));

el.classList.add("active");

}
</script>

</body>
</html>
